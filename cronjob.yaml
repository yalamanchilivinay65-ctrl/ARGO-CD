---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: myjob
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: cont1
            image: nginx
            ports:
              - containerPort: 80
            args:
              - /bin/bash
              - -c
              - echo "Welcome to K8s session"; sleep 10;
