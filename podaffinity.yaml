apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - redis

              topologyKey: kubernetes.io/hostname

      containers:
        - name: web
          image: nginx
          ports:
            - containerPort: 80
