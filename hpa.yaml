apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-1

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deployment-1

  minReplicas: 2
  maxReplicas: 7

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
