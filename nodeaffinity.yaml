apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-1

spec:
  replicas: 3

  selector:
    matchLabels:
      app: ola

  template:
    metadata:
      labels:
        app: ola

    spec:
      containers:
        - name: cont1
          image: nginx
          ports:
            - containerPort: 80

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - worker
